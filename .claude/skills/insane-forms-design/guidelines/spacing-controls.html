<!-- @dsCard group="Spacing" viewport="700x130" name="Control metrics" subtitle="42px field · 13/26 button · 6/8 nav item · radius 0" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>

<div style="padding:16px 18px;display:flex;gap:16px;align-items:center">
  <div style="width:180px;height:42px;border:var(--rule-w) solid var(--input);background:var(--background)"></div>
  <button style="font-family:var(--font-sans);font-size:14px;font-weight:700;padding:13px 26px;background:var(--primary);color:var(--primary-foreground);border:none">Save</button>
  <span style="padding:6px 8px;background:var(--primary);color:var(--primary-foreground);font-size:14px;font-weight:700">Overview</span>
  <span class="lab">radius 0 · shadow none</span>
</div>
