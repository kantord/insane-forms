<!-- @dsCard group="Type" viewport="700x120" name="Two families, two jobs" subtitle="Archivo for human voice, mono for machine voice" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>

<div style="padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div style="border-right:var(--rule-w) solid var(--border);padding-right:18px"><div style="font-weight:900;font-size:22px;letter-spacing:-.03em">Archivo</div><div style="font-size:13px;color:var(--muted-foreground);margin-top:4px">Headlines, UI, prose. 400–900.</div></div>
  <div><div style="font-family:var(--font-mono);font-size:20px">Spline Sans Mono</div><div style="font-size:13px;color:var(--muted-foreground);margin-top:4px">Code, labels, counters. 400–700.</div></div>
</div>
