<!-- @dsCard group="Colors" viewport="700x120" name="Rules and grounds" subtitle="2px in light, 1px in dark; ground change instead of shadow" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>

<div style="padding:16px 18px;display:flex;gap:18px;align-items:stretch">
  <div style="flex:1;border:2px solid #111110;background:#fbfbf9;padding:12px"><div class="lab">light · 2px</div></div>
  <div style="flex:1;border:1px solid #35332d;background:#1c1b18;padding:12px"><div class="lab" style="color:#8a8578">dark · 1px</div></div>
  <div style="flex:1;background:#f0f0ec;padding:12px"><div class="lab">--muted ground, no border</div></div>
</div>
