<!-- @dsCard group="Colors" viewport="700x130" name="Semantic — dark" subtitle="Warm charcoal ground, bone type, amber accent" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>
<style>body{background:#1c1b18;color:#efece3}.lab,.val{color:#8a8578}.val{color:#efece3}.chip{border-color:#35332d}</style>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#1c1b18"></div><div class="lab">--background</div><div class="val">#1c1b18</div></div>
  <div class="sw"><div class="chip" style="background:#24231f"></div><div class="lab">--muted</div><div class="val">#24231f</div></div>
  <div class="sw"><div class="chip" style="background:#191815"></div><div class="lab">--rail</div><div class="val">#191815</div></div>
  <div class="sw"><div class="chip" style="background:#efece3"></div><div class="lab">--foreground</div><div class="val">#efece3</div></div>
  <div class="sw"><div class="chip" style="background:#bdb8aa"></div><div class="lab">--body</div><div class="val">#bdb8aa</div></div>
  <div class="sw"><div class="chip" style="background:#d9a441"></div><div class="lab">--primary</div><div class="val">#d9a441</div></div>
</div>
