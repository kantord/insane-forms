<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>

<div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px;max-width:640px">
  <p style="margin:0;font-size:22px;line-height:1.5;color:var(--body)">A schema describes the shape of the data.</p>
  <p style="margin:0;font-size:16px;line-height:1.75;color:var(--body)">A field is a Zod schema with a renderer in its metadata. The renderer receives the node's draft value and a setter; everything it paints is yours.</p>
  <p style="margin:0;font-size:14px;line-height:1.65;color:var(--body)">Aside notes run at 14px in the right rail.</p>
</div>
