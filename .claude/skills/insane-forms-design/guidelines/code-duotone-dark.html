<!-- @dsCard group="Code" viewport="700x150" name="Duotone — dark" subtitle="Same roles, amber accent" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>
<style>body{background:#1c1b18;color:#efece3}.lab{color:#8a8578}.val{color:#efece3}.chip{border-color:#35332d}</style>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#efece3"></div><div class="lab">--code-n1</div><div class="val">#efece3</div></div>
  <div class="sw"><div class="chip" style="background:#a9a49a"></div><div class="lab">--code-n2</div><div class="val">#a9a49a</div></div>
  <div class="sw"><div class="chip" style="background:#8d887e"></div><div class="lab">--code-n3</div><div class="val">#8d887e</div></div>
  <div class="sw"><div class="chip" style="background:#d9a441"></div><div class="lab">--code-a1</div><div class="val">#d9a441</div></div>
  <div class="sw"><div class="chip" style="background:#e8c07a"></div><div class="lab">--code-a2</div><div class="val">#e8c07a</div></div>
  <div class="sw"><div class="chip" style="background:#141310"></div><div class="lab">--code-bg</div><div class="val">#141310</div></div>
</div>
