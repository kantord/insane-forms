<!-- @dsCard group="Code" viewport="700x150" name="Duotone — light" subtitle="Three neutral steps, two accent steps" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:52px;border:var(--rule-w) solid var(--border);box-sizing:border-box;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted-foreground);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--foreground);}
</style>

<div class="wrap">
  <div class="sw"><div class="chip" style="background:#111110"></div><div class="lab">--code-n1</div><div class="val">#111110</div></div>
  <div class="sw"><div class="chip" style="background:#56564f"></div><div class="lab">--code-n2</div><div class="val">#56564f</div></div>
  <div class="sw"><div class="chip" style="background:#6b6b64"></div><div class="lab">--code-n3</div><div class="val">#6b6b64</div></div>
  <div class="sw"><div class="chip" style="background:#3a35ff"></div><div class="lab">--code-a1</div><div class="val">#3a35ff</div></div>
  <div class="sw"><div class="chip" style="background:#4a45e6"></div><div class="lab">--code-a2</div><div class="val">#4a45e6</div></div>
  <div class="sw"><div class="chip" style="background:#f0f0ec"></div><div class="lab">--code-bg</div><div class="val">#f0f0ec</div></div>
</div>
